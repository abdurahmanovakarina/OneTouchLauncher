name: Build OneTouchHome APK

on:
  push:
    branches:
      - main
    paths:
      - "OneTouchLauncher/OneTouchLauncher/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build release APK
        working-directory: OneTouchLauncher/OneTouchLauncher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OneTouchHome-apk
          path: OneTouchLauncher/OneTouchLauncher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
